name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  review:
    name: Dependency Review
    uses: AgentsKit-io/.github/.github/workflows/dependency-review.yml@5a584290feaaa0a800a28d24583d16f15102bea1 # main
    with:
      fail-on-severity: high
    permissions:
      contents: read
      pull-requests: read

  audit:
    name: npm audit
    uses: AgentsKit-io/.github/.github/workflows/audit.yml@5a584290feaaa0a800a28d24583d16f15102bea1 # main
    with:
      package-manager: npm
      working-directories: '["."]'
      audit-level: high
      production-only: true
    permissions:
      contents: read

  docs-audit:
    name: npm audit (apps/docs)
    uses: AgentsKit-io/.github/.github/workflows/audit.yml@5a584290feaaa0a800a28d24583d16f15102bea1 # main
    with:
      package-manager: npm
      working-directories: '["apps/docs"]'
      audit-level: high
      production-only: false
    permissions:
      contents: read
