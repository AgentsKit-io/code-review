name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-version-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Create or update the Changesets version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update Version Packages pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dispatch required checks on the version branch
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -eu
          gh pr view "$VERSION_PR" --json author,headRefName,isCrossRepository,state > "$RUNNER_TEMP/version-pr.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/version-pr.json", "utf8"));
            if (!pr.author.is_bot || pr.author.login !== "app/github-actions" || pr.headRefName !== "changeset-release/main" || pr.isCrossRepository || pr.state !== "OPEN") throw new Error("untrusted version PR");
          '
          for workflow in ci.yml codeql.yml dependency-review.yml; do
            gh workflow run "$workflow" --ref changeset-release/main
          done
