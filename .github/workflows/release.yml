name: Prepare Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-version-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Create or update the Changesets version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create or update Version Packages pull request
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Allow required workflows for the trusted version PR
        timeout-minutes: 2
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_PR: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          set -eu
          gh pr view "$VERSION_PR" --json author,headRefName,headRefOid,isCrossRepository,state > "$RUNNER_TEMP/version-pr.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pr = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/version-pr.json", "utf8"));
            if (!pr.author.is_bot || pr.author.login !== "app/github-actions" || pr.headRefName !== "changeset-release/main" || pr.isCrossRepository || pr.state !== "OPEN") throw new Error("untrusted version PR");
          '
          version_sha="$(jq -r .headRefOid "$RUNNER_TEMP/version-pr.json")"
          for attempt in $(seq 1 12); do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs" -f event=pull_request -f head_sha="$version_sha" -F per_page=100 > "$RUNNER_TEMP/version-runs.json"
            jq --arg pr "$VERSION_PR" '[.workflow_runs[] | select(.head_branch == "changeset-release/main" and any(.pull_requests[]; .number == ($pr | tonumber))) | select(.path == ".github/workflows/ci.yml" or .path == ".github/workflows/codeql.yml" or .path == ".github/workflows/dependency-review.yml")]' "$RUNNER_TEMP/version-runs.json" > "$RUNNER_TEMP/required-runs.json"
            for run_id in $(jq -r '.[] | select(.conclusion == "action_required") | .id' "$RUNNER_TEMP/required-runs.json"); do
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/approve"
            done
            if [ "$(jq '[.[].path] | unique | length' "$RUNNER_TEMP/required-runs.json")" -eq 3 ]; then exit 0; fi
            sleep 5
          done
          echo 'Required version-PR workflow events did not arrive within the bounded wait.' >&2
          exit 1
