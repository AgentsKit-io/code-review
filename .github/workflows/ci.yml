name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Doc Bridge uses a Git SHA for clean checkouts and a content hash for dirty ones.
      # The committed index is content-addressed, so keep that revision mode through the gates.
      - run: touch .doc-bridge/.ci-content-revision
      - run: npm run docs:index
      - run: git diff --exit-code -- doc-bridge.config.json .doc-bridge llms-full.txt
      - run: npm run check
      - run: npm pack --dry-run
      - if: always()
        run: rm -f .doc-bridge/.ci-content-revision
