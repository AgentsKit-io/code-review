name: CI standard

# This repository's settings for the organization's reusable CI pipeline
# (AgentsKit-io/.github, docs/ci.md). Called by ci.yml.
# Tests stay on node:test (not Vitest), so the Vitest time budget does not apply.

on:
  workflow_call:
    outputs:
      mode:
        description: Pipeline mode (draft, light, pr, full, seed or skip).
        value: ${{ jobs.standard.outputs.mode }}

permissions: {}

jobs:
  standard:
    uses: AgentsKit-io/.github/.github/workflows/ci.yml@c624db48051670469618d9c74854f3a1affc0138
    permissions:
      actions: write
      contents: read
    with:
      installer: auto
      typecheck-command: bash scripts/ci/check.sh
      test-command: npm run test:coverage
      affected-test-command: npm run test:coverage
      build-command: bash scripts/ci/build.sh
      job-timeout-minutes: 20
